name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This workflow never links a Supabase project, deploys, or receives repository
# secrets. AI adapters stay local/fake; cloud integrations are contract-tested.
env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  SILOGIUM_AI_PROVIDER: local
  SILOGIUM_ALLOW_LOCAL_EXECUTION: "true"
  OPENAI_API_KEY: ""
  NEXT_PUBLIC_SUPABASE_URL: ""
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  MODAL_JUDGE_ENDPOINT: ""
  MODAL_JUDGE_TOKEN: ""

jobs:
  application:
    name: TypeScript, Python, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.11"
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Unit and real local-judge tests (TypeScript and Python)
        run: npm test
      - name: Offline Python sandbox-controller tests
        run: python -m unittest discover -s infra/modal -p "test_*.py" -v
      - name: Install pinned SDKs only for declaration smoke
        run: python -m pip install -r infra/modal/requirements-deploy.txt
      - name: Load Modal definitions with network blocked
        run: python -m infra.modal.check_sdk
      - name: Check workspace types
        run: npm run typecheck
      - name: Build without production secrets
        run: npm run build
      - name: Production requests cannot fall back to demo
        env:
          NEXT_DIST_DIR: .next
        run: npm run test:production-guard

  database:
    name: Migrations and pgTAP (local PostgreSQL 15)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          package-manager-cache: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.117.0"
      - name: Start disposable local database and apply migrations
        run: supabase db start
      - name: Run every database contract through pgTAP
        run: supabase test db --local
      - name: Remove only this runner's disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

  browser:
    name: Chromium desktop and mobile (local demo)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.0"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.11"
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Generate seed catalog
        run: npm run content:generate
      - name: Install Chromium and its runner libraries
        run: npx playwright install --with-deps chromium
      - name: Exercise desktop and mobile on isolated port 3100
        # Existing Playwright config owns/cleans up its Next dev process and uses
        # .next-e2e. Never run against a developer's already-running server.
        run: npx playwright test --project=chromium --project=mobile --workers=1
